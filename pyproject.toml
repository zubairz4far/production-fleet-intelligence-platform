[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-fleet-intelligence-platform"
version = "0.5.0"
description = "Fleet ML, anomaly detection, ETA, routing optimization, and production MLOps integration."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.9,<3",
  "joblib>=1.4,<2",
  "ortools>=9.15,<10",
  "fastapi>=0.141,<1",
  "uvicorn>=0.30,<1",
  "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
mlops = [
  "mlflow>=3.15,<4",
  "confluent-kafka>=2.15,<3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
fleet-intelligence = "fleet_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
