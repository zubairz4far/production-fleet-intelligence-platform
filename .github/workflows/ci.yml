name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Generate deterministic CI dataset
        run: python scripts/generate_synthetic_fleet.py --output /tmp/fleet.csv --rows 1200 --vehicles 60 --seed 42
      - name: Run leakage-safe baseline benchmark
        run: python -m fleet_intelligence.cli train --data /tmp/fleet.csv --report /tmp/baseline_report.json
      - name: Validate benchmark report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/baseline_report.json').read_text())
          assert report['split']['strategy'] == 'chronological_holdout'
          assert report['split']['train_end'] <= report['split']['test_start']
          assert report['metrics']['pr_auc'] >= 0.0
          assert report['metrics']['roc_auc'] >= 0.0
          assert report['metrics']['brier_score'] <= 1.0
          assert report['threshold_policy']['false_negative_cost'] == 5.0
          print(json.dumps(report['metrics'], indent=2))
          PY
