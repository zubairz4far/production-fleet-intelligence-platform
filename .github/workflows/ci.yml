name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Generate deterministic CI dataset
        run: >-
          python scripts/generate_synthetic_fleet.py
          --output /tmp/fleet.csv
          --rows 1200
          --vehicles 60
          --seed 42
      - name: Run v0.1 compatibility baseline
        run: >-
          python -m fleet_intelligence.cli train
          --data /tmp/fleet.csv
          --report /tmp/baseline_report.json
      - name: Run v0.2 model promotion evaluation
        run: >-
          python -m fleet_intelligence.cli compare
          --data /tmp/fleet.csv
          --report /tmp/model_comparison_v0.2.json
          --artifact-dir /tmp/models
      - name: Validate v0.2 report and artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/model_comparison_v0.2.json').read_text())
          assert report['version'] == '0.2.0'
          assert report['split']['strategy'] == 'chronological_train_dev_test'
          assert report['split']['train_end'] <= report['split']['dev_start']
          assert report['split']['dev_end'] <= report['split']['test_start']
          assert report['threshold_policy']['selection_partition'] == 'development'
          assert report['promotion']['decision'] in {'promote', 'reject'}
          assert report['promotion']['test_observed_once'] is True
          assert Path('/tmp/models/baseline_logistic.joblib').exists()
          assert Path('/tmp/models/candidate_calibrated.joblib').exists()
          assert Path('/tmp/models/metadata.json').exists()
          PY
      - name: Generate deterministic anomaly fixture
        run: >-
          python scripts/generate_synthetic_fleet.py
          --output /tmp/fleet_anomaly.csv
          --rows 1200
          --vehicles 60
          --seed 42
          --with-anomalies
          --anomaly-rate 0.12
      - name: Validate anomaly fixture chronology
        run: |
          python - <<'PY'
          import pandas as pd

          frame = pd.read_csv('/tmp/fleet_anomaly.csv')
          train_end = int(len(frame) * 0.60)
          dev_end = int(len(frame) * 0.80)
          assert frame.iloc[:train_end]['telemetry_anomaly'].sum() == 0
          assert frame.iloc[train_end:dev_end]['telemetry_anomaly'].sum() > 0
          assert frame.iloc[dev_end:]['telemetry_anomaly'].sum() > 0
          PY
      - name: Run v0.3 telemetry anomaly benchmark
        run: >-
          python -m fleet_intelligence.cli anomaly
          --data /tmp/fleet_anomaly.csv
          --report /tmp/anomaly_report_v0.3.json
          --artifact-dir /tmp/anomaly-model
      - name: Validate v0.3 report and artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/anomaly_report_v0.3.json').read_text())
          assert report['version'] == '0.3.0'
          assert report['task'] == 'telemetry_anomaly_detection'
          assert report['feature_engineering']['feature_count'] >= 30
          assert report['feature_engineering']['causal_rolling_policy'].startswith('shift(1)')
          assert report['split']['strategy'] == 'chronological_train_dev_test'
          assert report['split']['train_end'] <= report['split']['dev_start']
          assert report['split']['dev_end'] <= report['split']['test_start']
          assert report['threshold_policy']['selection_partition'] == 'development'
          assert report['promotion']['decision'] in {'promote', 'reject'}
          assert report['promotion']['test_observed_once'] is True
          assert report['drift']['simulated_high_drift_features']
          assert report['drift']['simulated_max_psi'] > report['drift']['clean_max_psi']
          missing = report['robustness']['missing_sensor_families']
          assert 0.0 <= missing['pr_auc_drop'] <= 1.0
          assert 0.0 <= missing['recall_drop'] <= 1.0
          assert Path('/tmp/anomaly-model/anomaly_isolation_forest.joblib').exists()
          assert Path('/tmp/anomaly-model/anomaly_metadata.json').exists()
          PY
      - name: Generate deterministic mobility fixtures
        run: >-
          python scripts/generate_synthetic_mobility.py
          --trips-output /tmp/eta_trips.csv
          --stops-output /tmp/routing_stops.csv
          --rows 1600
          --stops 18
          --seed 84
      - name: Run v0.4 ETA and routing benchmark
        run: >-
          python -m fleet_intelligence.cli eta-routing
          --trips /tmp/eta_trips.csv
          --stops /tmp/routing_stops.csv
          --report /tmp/mobility_report_v0.4.json
          --artifact-dir /tmp/mobility
          --vehicle-count 3
          --vehicle-capacity 6
      - name: Validate v0.4 report and artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/mobility_report_v0.4.json').read_text())
          assert report['version'] == '0.4.0'
          assert report['release'] == 'eta_prediction_and_capacitated_routing'
          eta = report['eta']
          assert eta['split']['strategy'] == 'chronological_train_dev_test'
          assert eta['split']['train_end'] <= eta['split']['dev_start']
          assert eta['split']['dev_end'] <= eta['split']['test_start']
          assert eta['promotion']['test_observed_once'] is True
          assert eta['promotion']['decision'] == 'promote'
          routing = report['routing']
          assert routing['promotion']['decision'] == 'promote'
          assert routing['candidate']['metrics']['unserved_stops'] == 0
          assert routing['candidate']['metrics']['capacity_violation_units'] == 0
          assert routing['candidate']['metrics']['total_distance_km'] <= (
              routing['baseline']['metrics']['total_distance_km'] + 1e-6
          )
          assert report['release_gate']['decision'] == 'promote'
          assert Path('/tmp/mobility/eta/eta_hist_gradient_boosting.joblib').exists()
          assert Path('/tmp/mobility/eta/eta_metadata.json').exists()
          print(json.dumps({
              'eta_baseline': eta['baseline']['test_metrics'],
              'eta_candidate': eta['candidate']['test_metrics'],
              'eta_promotion': eta['promotion'],
              'routing_baseline': routing['baseline']['metrics'],
              'routing_candidate': routing['candidate']['metrics'],
              'routing_promotion': routing['promotion'],
              'release_gate': report['release_gate'],
          }, indent=2))
          PY
